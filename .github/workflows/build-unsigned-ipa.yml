name: Build Unsigned iOS IPA (SideStore sideload)

# Manual only -- this is for Jan's own personal sideload via SideStore, not a
# release pipeline. SideStore signs the app itself with a free Apple ID at
# install time, so this deliberately builds with code signing turned OFF --
# EAS Build's cloud iOS pipeline needs a paid Apple Developer Program
# account (verified against Expo's own docs), this sidesteps that entirely
# by using a real Xcode toolchain on a GitHub-hosted macOS runner instead
# (unlimited free minutes on a public repo).
#
# Also publishes a SideStore/AltStore "source" (source.json + the ipa + the
# app icon) to a stable-URL GitHub Release, tag `ios-latest`, with its
# assets overwritten on every run. Add that source.json's raw URL to
# SideStore once (Browse tab -> paste URL -> Add Source) and every future
# run of this workflow shows up there as a normal one-tap Update -- no more
# manually re-downloading and re-importing an .ipa each time.
#
# Runs on every push to master that touches app/ (this is Jan's own repo, so
# staying fresh is just "rebuild when the app changes" -- no upstream to
# sync from, unlike the equivalent Nuvio pipeline), plus workflow_dispatch
# for a manual rebuild any time.
on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/build-unsigned-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Stamp build number from the run number
        # app.json has no ios.buildNumber, so without this every prebuild
        # bakes the same static CFBundleVersion=1 into the native project no
        # matter which commit/run produced it -- SideStore would then never
        # see a build number change and stop offering updates. Stamp it here,
        # before prebuild, so it's Expo that carries it into the native
        # project (same mechanism Expo normally uses for this field).
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.ios = cfg.expo.ios || {};
            cfg.expo.ios.buildNumber = '${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Expo prebuild (generate native ios/ project)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Detect workspace/scheme
        id: detect
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next} flag && NF{print; exit}' | xargs)
          echo "Detected workspace=$WORKSPACE scheme=$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          cd ios
          xcodebuild archive \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Read app version + build + bundle id from the BUILT Info.plist
        id: appmeta
        # Read these straight out of the .app that Xcode actually produced,
        # not out of app.json / a run counter computed independently. Those
        # two can drift apart (e.g. app.json has no ios.buildNumber, so Expo
        # prebuild always bakes CFBundleVersion=1 into the native project
        # regardless of what this workflow later claims) -- and when they do,
        # SideStore refuses to install: "The downloaded version ... does not
        # match the build number specified by the source." Reading the real
        # Info.plist here guarantees source.json can never disagree with the
        # binary it's describing.
        run: |
          cd ios/build/App.xcarchive/Products/Applications
          APP=$(ls -d *.app | head -1)
          PLIST="$APP/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          echo "Built app actually reports: version=$VERSION build=$BUILD bundle_id=$BUNDLE_ID"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Package raw IPA (Payload/*.app zipped, no signing)
        id: package
        run: |
          cd ios/build/App.xcarchive/Products/Applications
          APP=$(ls -d *.app | head -1)
          mkdir Payload
          mv "$APP" Payload/
          zip -r -y ../../../DataServer.ipa Payload
          SIZE=$(stat -f%z ../../../DataServer.ipa)
          echo "Built: $(ls -la ../../../DataServer.ipa)"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate SideStore/AltStore source.json
        run: |
          cat > ios/build/source.json <<EOF
          {
            "name": "Jan's DataServer builds",
            "identifier": "nl.jdries.dataserver.source",
            "apps": [
              {
                "name": "DataServer",
                "bundleIdentifier": "${{ steps.appmeta.outputs.bundle_id }}",
                "developerName": "janibert1",
                "localizedDescription": "Personal DataServer mobile app -- auto-built from the latest commit on master.",
                "iconURL": "https://github.com/${{ github.repository }}/releases/download/ios-latest/icon.png",
                "versions": [
                  {
                    "version": "${{ steps.appmeta.outputs.version }}",
                    "buildVersion": "${{ steps.appmeta.outputs.build }}",
                    "date": "$(date -u +%Y-%m-%d)",
                    "localizedDescription": "Build ${{ steps.appmeta.outputs.build }} (run #${{ github.run_number }}) from commit ${{ github.sha }}",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/ios-latest/DataServer.ipa",
                    "size": ${{ steps.package.outputs.size }}
                  }
                ],
                "appPermissions": { "entitlements": [], "privacy": {} }
              }
            ],
            "news": []
          }
          EOF
          cat ios/build/source.json

      - uses: actions/upload-artifact@v4
        with:
          name: DataServer-unsigned-ipa
          path: app/ios/build/DataServer.ipa
          retention-days: 14

      - name: Publish to stable-URL release (assets overwritten each run)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "iOS build (auto-updated, latest run wins)"
          body: "Personal sideload build for SideStore. Not a real release -- assets here are overwritten on every workflow run. Add source.json's URL as a SideStore source to get one-tap updates."
          prerelease: true
          files: |
            app/ios/build/DataServer.ipa
            app/ios/build/source.json
            app/assets/images/icon.png
